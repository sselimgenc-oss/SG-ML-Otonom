<style>
/* panel.css — kendi stilimiz; tema/degisken yaklasimi 1L3A pano.py CSS dizgisinden uyarlandi (kullanicinin kendi projesi, 2026-11-16). Dis URL, dis yazi tipi yok. */
:root{--bg:#f4f6f8;--kart:#fff;--yazi:#16202a;--sol:#5a6773;--cizgi:#dde3e9;--iyi:#0e8a4f;--kotu:#c62828;--notr:#6b7684;--uyar:#b26a00;--vurgu:#a85f00;--r:12px;--iyibg:#e3f5ea;--kotubg:#fdeaea;--uyarbg:#fff3dc;--gol:rgba(0,0,0,.06)}
:root[data-theme="dark"]{--bg:#0e1319;--kart:#171e26;--yazi:#e6edf3;--sol:#8b98a5;--cizgi:#27313b;--iyi:#3fb97a;--kotu:#f0625f;--notr:#98a4b1;--uyar:#e0a030;--vurgu:#f5a524;--iyibg:#12301f;--kotubg:#3a1a1b;--uyarbg:#352a12;--gol:rgba(255,255,255,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1319;--kart:#171e26;--yazi:#e6edf3;--sol:#8b98a5;--cizgi:#27313b;--iyi:#3fb97a;--kotu:#f0625f;--notr:#98a4b1;--uyar:#e0a030;--vurgu:#f5a524;--iyibg:#12301f;--kotubg:#3a1a1b;--uyarbg:#352a12;--gol:rgba(255,255,255,.06)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yazi);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:12px 16px 40px;overflow-x:hidden}
.gomulu .ust{display:none}
.gomulu main{padding-top:8px}
.ust{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mk{display:flex;align-items:center;gap:8px}
.lg0{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--vurgu);color:#fff;font-weight:700;font-size:14px}
h1{font-size:17px;margin:0;letter-spacing:.2px}
.un{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.so{color:var(--sol);font-size:12px}
button{font:inherit;font-size:13px;padding:5px 11px;border-radius:8px;border:1px solid var(--cizgi);background:var(--kart);color:var(--yazi);cursor:pointer}
button:hover{border-color:var(--vurgu)}
.rozet{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--gol);color:var(--sol)}
.uyari{padding:9px 12px;border-radius:10px;margin:0 0 8px;font-size:13.5px;background:var(--uyarbg);color:var(--uyar);border:1px solid var(--uyar)}
.uyari.kritik{background:var(--kotubg);color:var(--kotu);border-color:var(--kotu)}
/* serit: telefonda 3x2, masaustunde 1x6 */
.serit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (min-width:900px){.serit{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ks{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:9px 10px;min-width:0}
.ks .e{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks .e .ipucu{display:inline-block;margin-left:5px;width:14px;height:14px;line-height:14px;text-align:center;border:1px solid var(--cizgi);border-radius:50%;font-size:10px;cursor:help}
.ks .b{font-size:18px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ks .a{font-size:11.5px;color:var(--sol);margin-top:1px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.ks.risk .b{font-size:14.5px;white-space:normal;line-height:1.2;display:flex;align-items:center;gap:6px}
.nokta{flex:none;width:10px;height:10px;border-radius:50%;background:var(--sol)}
.yesil .nokta{background:var(--iyi)}.sari .nokta{background:var(--uyar)}.kirmizi .nokta{background:var(--kotu)}
.ks.risk.yesil{border-color:var(--iyi)}.ks.risk.sari{border-color:var(--uyar);background:var(--uyarbg)}.ks.risk.gri{border-color:var(--cizgi);background:var(--gol)}.gri .nokta{background:var(--notr)}.gri,.yok.gri{color:var(--notr)}
.ks.risk.kirmizi{border-color:var(--kotu);background:var(--kotubg)}
.iyi{color:var(--iyi)}.kotu{color:var(--kotu)}.sol,.notr{color:var(--notr)}
/* sekmeler */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;border-bottom:1px solid var(--cizgi);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs{gap:0;justify-content:space-between}.tabs button{flex:1 1 auto;letter-spacing:.04em;border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 6px;font-weight:600;font-size:13px;color:var(--sol);white-space:nowrap}
.tabs button.on{color:var(--vurgu);border-bottom-color:var(--vurgu)}
.tabs button .hap{display:inline-block;margin-left:5px;padding:0 6px;border-radius:99px;background:var(--gol);color:var(--sol);font-size:10.5px;font-weight:700;letter-spacing:0}
.son-gun{margin:-6px 0 10px;text-align:left}
.sek{display:none}.sek.on{display:block}
/* kartlar */
.ig{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.ig.iki{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:var(--r);padding:13px 14px;min-width:0}
.kart h2{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--vurgu);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.kart h2 a,.lnk{color:var(--vurgu);text-transform:none;letter-spacing:0;font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-size:12.5px}
.kart.kirmizi{border-color:var(--kotu);background:var(--kotubg)}
.buyuk{font-size:16px;font-weight:600}
.satir{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--cizgi);font-size:14px}
.satir:first-of-type{border-top:0}
.satir span:first-child{color:var(--sol)}
.satir b{font-variant-numeric:tabular-nums;text-align:right}
.yok{color:var(--sol);font-size:13.5px;padding:6px 0}
.rt{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--gol)}
.rt.yesil{background:var(--iyibg);color:var(--iyi)}.rt.sari{background:var(--uyarbg);color:var(--uyar)}.rt.kirmizi{background:var(--kotubg);color:var(--kotu)}.rt.gri{background:var(--gol);color:var(--notr)}
.yon{display:inline-block;margin-left:5px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;vertical-align:1px}
.yon.long{background:var(--iyibg);color:var(--iyi)}.yon.short{background:var(--kotubg);color:var(--kotu)}
/* tablolar: 4 sutun, yatay kaydirma yok */
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--sol);text-align:left;padding:4px 4px 6px;font-weight:700}
td{padding:9px 4px;border-top:1px solid var(--cizgi);vertical-align:top;overflow:hidden;text-overflow:ellipsis}
th.sg,td.sg{text-align:right}
col.c1{width:31%}col.c2{width:27%}col.c3{width:24%}col.c4{width:18%}
table.n5 col.c1{width:22%}table.n5 col.c2{width:20%}table.n5 col.c3{width:21%}table.n5 col.c4{width:19%}table.n5 col.c5{width:18%}
th.sirali{cursor:pointer;user-select:none;white-space:nowrap}
tr.satir-t{cursor:pointer}
tr.satir-t:hover td{background:var(--gol)}
td .u{font-size:11.5px;color:var(--sol);font-variant-numeric:tabular-nums}
td .n{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.dty td{background:var(--gol);padding:8px 10px}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;font-size:13px}
.dl div span{display:block;color:var(--sol);font-size:11px}
.dl .g{grid-column:1/-1}
.daha{display:block;width:100%;margin-top:8px}
.donem{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.donem button.on{background:var(--vurgu);border-color:var(--vurgu);color:#fff}
.ozet-ic{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}
.ozet-ic b{font-variant-numeric:tabular-nums}
.d4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.d4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.d4 .ks .b{font-size:17px}
/* grafik */
.gk{position:relative;height:150px;margin:4px 0 18px 38px}
.gk svg{width:100%;height:100%;display:block}
.gk .yt{position:absolute;left:-38px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--sol);width:34px;text-align:right}
.gk .ek{position:absolute;left:0;right:0;bottom:-16px;display:flex;justify-content:space-between;font-size:10.5px;color:var(--sol)}
.izg{stroke:var(--cizgi);stroke-width:1;vector-effect:non-scaling-stroke}
.baz{stroke:var(--sol);stroke-dasharray:4 4;stroke-width:1;vector-effect:non-scaling-stroke}
.cizgi{fill:none;stroke:var(--vurgu);stroke-width:2;vector-effect:non-scaling-stroke}
.alan{fill:var(--vurgu);opacity:.12}
.cizgi.k{stroke:var(--kotu)}.alan.k{fill:var(--kotu)}
/* teknik: katli */
details{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;margin-bottom:8px;padding:0 14px}
summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--sol)}
details[open] summary::after{content:"−"}
details>div{padding-bottom:12px}
.cub{height:7px;border-radius:4px;background:var(--gol);overflow:hidden;margin-top:3px}
.cub i{display:block;height:100%;background:var(--vurgu)}
.cub i.s{background:var(--uyar)}.cub i.k{background:var(--kotu)}
.lim{margin:7px 0;font-size:13.5px}
.lim .r{display:flex;justify-content:space-between;gap:8px}
@media (max-width:420px){
  .tabs button{font-size:10.5px;padding:9px 1px;letter-spacing:-.3px}
  main{padding:10px 12px 32px}.tabs{margin:0 -12px 10px;padding:0 12px}
  .ks .b{font-size:16.5px}.ks.risk .b{font-size:13.5px}.ks .e{font-size:9.5px;letter-spacing:.02em}
}
@media print{.tabs,.un{display:none}.sek{display:block}}

</style>

      var o = kart('Kazanma oranı');
      if (z.oran.olculemedi) add(o, yok(z.oran.olculemedi));
      else add(o, satir('Kazanan işlem', '%' + trn(z.oran.kazanma_yuzde, 0) + ' (' + z.oran.n + ' işlem)'),
        satir('Ortalama kazanç', usdS(z.oran.ort_kazanc), 'iyi'), satir('Ortalama kayıp', usdS(z.oran.ort_kayip), 'kotu'));
      add(ig, o);
    }
    if (z.kol.length) {
      var kk = kart('Kaynağa göre K/Z');
      z.kol.forEach(function (r) { add(kk, satir(r.kol + ' · ' + r.n + ' işlem', usdS(r.kz), cls(r.kz))); });
      add(ig, kk);
    }
    if (z.masraf) {
      var m = kart('Masraflar');
      add(m, satir('Komisyon · 30 gün', usd(z.masraf['30g'].komisyon)), satir('Fonlama · 30 gün', usdS(-z.masraf['30g'].fonlama)),
        satir('Komisyon · toplam', usd(z.masraf.tumu.komisyon)), satir('Fonlama · toplam', usdS(-z.masraf.tumu.fonlama)));
      add(ig, m);
    }
    add(root, ig);
  }

  /* ÖĞRENME */
  function katkiSatir(k) {
    if (k.olculemedi) return satir('Katkı', k.olculemedi.replace('Henüz', 'henüz'));
    return satir('Katkı', (k.yaklasik ? '≈ ' : '') + usdS(k.usd) + ' (' + k.n + ' sonucu belli karar)', cls(k.usd));
  }
  function tabOgrenme(root, p) {
    clear(root);
    var ig = el('div', 'ig iki');
    if (p.ders) {
      var d = p.ders, k = kart('Ders kartı');
      add(k, add(el('div'), rozetRenk(d.durum, d.renk)));
      if (d.son) add(k, satir('Son öğrendiği', d.son.tarih), el('div', 'yok', d.son.metin));
      add(k, satir('Son 7 günde etkilediği işlem', String(d.degisen_7g)), katkiSatir(d.katki));
      add(ig, k);
      if (d.son5.length) {
        var l = kart('Son dersler');
        d.son5.forEach(function (s) { add(l, satir(s.tarih, s.metin, s.geri ? 'kotu' : '')); });
        add(ig, l);
      }
    }
    if (p.kucultme) {
      var kk2 = kart('Kademeli küçültme');
      add(kk2, el('div', 'yok', 'Son işlemleri zararda olan kolların işlem riski küçültüldü (kol kapanmaz; kâra dönünce geri yükselir).'));
      p.kucultme.kollar.forEach(function (r) {
        add(kk2, satir(r.kol, '%' + Math.round(r.carpan * 100) + ' boyut · son ' + (num(r.net_10) ? '10' : '5') + ': ' + sgn(num(r.net_10) ? r.net_10 : r.net_5) + ' R', 'kotu'));
      });
      add(ig, kk2);
    }
    if (!p.ders && !p.kucultme) add(ig, yokKart('Henüz öğrenme verisi yok.'));
    add(root, ig);
  }

  /* TEKNİK (katlı) */
  function katli(baslik, renk, bodyFn, ac) {
    var d = el('details'), s = el('summary');
    if (ac) d.setAttribute('open', '');
    add(s, el('span', '', baslik), renk ? el('span', 'nokta ' + renk) : null);
    add(d, s, bodyFn(el('div')));
    return d;
  }
  function bar(ad, kul, lim, pct) {
    var w = el('div', 'lim'), r = el('div', 'r');
    add(r, el('span', '', ad), el('b', '', f2(kul) + ' / ' + f2(lim) + ' $'));
    var c = el('div', 'cub'), i = el('i', pct >= 90 ? 'k' : (pct >= 70 ? 's' : ''));
    i.style.width = Math.min(Math.max(num(pct) ? pct : 0, 0), 100) + '%';
    return add(w, r, add(c, i));
  }
  function tabTeknik(root, p) {
    clear(root);
    var t = p.teknik;
    if (t.saglik) {
      add(root, katli('Sağlık', t.saglik.renk, function (b) {
        add(b, add(el('div'), rozetRenk(t.saglik.durum, t.saglik.renk)));
        t.saglik.uyarilar.forEach(function (u) { add(b, el('div', 'yok', u)); });
        (t.saglik.diger_botlar || []).forEach(function (u) { add(b, el('div', 'yok gri', u)); });
        (t.saglik.senden || []).forEach(function (u) { add(b, el('div', 'yok', 'Senden: ' + u)); });
        if (t.saglik.kontrol_bayat) add(b, el('div', 'yok kotu', 'Sağlık kontrolü bir süredir çalışmamış.'));
        return b;
      }, t.saglik.renk !== 'yesil'));
    }
    if (t.dayaniklilik) add(root, katli('Dayanıklılık', 'sari', function (b) {
      t.dayaniklilik.karantina.forEach(function (u) { add(b, el('div', 'yok kotu', u)); });
      t.dayaniklilik.sembol.forEach(function (u) { add(b, el('div', 'yok kotu', u)); });
      return b;
    }, true));
    if (t.limitler) add(root, katli('Risk limitleri', '', function (b) {
      t.limitler.forEach(function (r) { add(b, bar(r.ad, r.kullanilan, r.limit, r.yuzde)); });
      return b;
    }));
    if (t.kapilar) add(root, katli('Kalite kapıları', '', function (b) {
      t.kapilar.forEach(function (r) { add(b, satir(r.ad, r.not, r.ok ? 'iyi' : 'kotu')); });
      return b;
    }));
    if (t.model) add(root, katli('Model ayrıntısı', '', function (b) {
      t.model.forEach(function (r) { add(b, satir(r.ad + ' · bugünkü çağrı', String(r.cagri_bugun)), satir('Bu ay maliyet', usd(r.maliyet_ay))); });
      return b;
    }));
    if (t.butce) add(root, katli('Bütçe', '', function (b) {
      return add(b, satir('Bu ay kullanılan', usd(t.butce.kullanilan)), satir('Aylık tavan', usd(t.butce.tavan)));
    }));
    if (t.kayitlar) add(root, katli('Kayıtlar', '', function (b) {
      return add(b, satir('Kapanan işlem', String(t.kayitlar.kapanan)), satir('Açık işlem', String(t.kayitlar.acik)), satir('Değerlendirilen fırsat', String(t.kayitlar.karar)));
    }));
    if (t.mutabakat) add(root, katli('İşlem kontrolü', t.mutabakat.uyusmazlik > 0 ? 'sari' : '', function (b) {
      return add(b, el('div', t.mutabakat.uyusmazlik > 0 ? 'yok kotu' : 'yok', 'Son kontrol: ' + t.mutabakat.son + ', ' + t.mutabakat.islem + ' işlem, ' + t.mutabakat.uyusmazlik + ' uyuşmazlık'));
    }));
    if (t.dogrulama) add(root, katli('Backtest / doğrulama', '', function (b) {
      if (num(t.dogrulama.eslesme)) add(b, satir('Kâğıt ile geçmiş test eşleşmesi', '%' + trn(t.dogrulama.eslesme * 100, 0)));
      if (num(t.dogrulama.pbo)) add(b, satir('Aşırı uyum riski (en yüksek)', '%' + trn(t.dogrulama.pbo * 100, 0)));
      if (t.dogrulama.uyari) add(b, el('div', 'yok kotu', 'Doğrulama raporunda uyarı var.'));
      return b;
    }));
    if (!root.firstChild) add(root, yokKart('Teknik veri yok.'));
  }

  function ciz(p) {
    renderTop(p);
    ['ozet', 'acik', 'kz', 'ogrenme', 'teknik'].forEach(function (k) { clear($('sek-' + k)); });
    if (!p || !p.ok) { add($('sek-ozet'), yokKart('Veri şu an okunamıyor.')); return; }
    S.gen = p.generated_at;
    tabOzet($('sek-ozet'), p); tabAcik($('sek-acik'), p); tabKz($('sek-kz'), p); tabOgrenme($('sek-ogrenme'), p); tabTeknik($('sek-teknik'), p);
  }

  /* ---------- baslat ---------- */
  function guncellemeEtiketi() {
    var u = $('uretim'), g = SNAP ? SNAP.generated_at : null;
    var s = g ? (Date.now() - Date.parse(g)) / 1000 : (Date.now() - S.t0) / 1000;
    u.textContent = 'son güncelleme ' + ago(s);
    if ((Date.now() - S.t0) / 1000 >= YENILE_S && location && typeof location.reload === 'function') location.reload();
  }
  function tema(v) {
    document.documentElement.setAttribute('data-theme', v);
    try { localStorage.setItem('pano_tema', v); } catch (e) { /* onemsiz */ }
  }
  function baslat() {
    siraOku();
    var iframe = false;
    try { iframe = window.self !== window.top; } catch (e) { iframe = true; }
    var tb = $('tema');
    if (iframe) {                                           // gomulu: kendi basligi ve Yenile/Tema yok; cihaz ayari izlenir
      document.documentElement.classList.add('gomulu');
      if (tb) tb.hidden = true;
    } else {
      var kay = null;
      try { kay = localStorage.getItem('pano_tema'); } catch (e) { kay = null; }
      if (kay === 'light' || kay === 'dark') document.documentElement.setAttribute('data-theme', kay);   // kayit yoksa: cihaz (CSS media)
      tb.addEventListener('click', function () {
        var d = document.documentElement.getAttribute('data-theme');
        if (d !== 'light' && d !== 'dark') d = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        tema(d === 'dark' ? 'light' : 'dark');
      });
    }
    $('yenile').addEventListener('click', function () { location.reload(); });
    if ($('snap-bant')) $('snap-bant').style.display = 'none';
    snapBanner();
    kurTabs();
    var son = null;
    try { son = localStorage.getItem('pano_sekme'); } catch (e) { son = null; }
    sec(TABS.some(function (x) { return x[0] === son; }) ? son : 'ozet');
    if (SNAP) $('damga').style.display = 'none';
    get('/api/pano?bot=' + BOT).then(function (p) { S.pano = p; ciz(p); sekmeSayilari(p); guncellemeEtiketi(); if (S.tab === 'kapanan') yukleKapanan(); });
    setInterval(function () { snapBanner(); guncellemeEtiketi(); }, 30000);     // yalniz etiket; ekran yeniden cizilmez
  }
  baslat();
})();

</script>
</body>
</html>

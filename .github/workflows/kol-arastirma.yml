# Kitap setuplari arastirmasi (24.11 kullanici karari: kollar eklenecek; kitaplarda en cok kullanilan setuplar denensin). Agent SDK, promosyon kredisi.
# Akis: Fable en cok kullanilan 12 setupu secer -> Sonnet onceki cerceveye ekler -> gelistirme + kilitli donem testi -> Fable her kol icin setup secer.
# Sonuclar yeni-kollar-test dalina yazilir; sunucu etkilenmez.
name: kol-arastirma

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kol-arastirma
  cancel-in-progress: false

env:
  DAL: claude/charming-hawking-ab5w5q
  SONNET: claude-sonnet-5-5
  FABLE: claude-fable-5-2

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DAL }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Vision zip onbellegi
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: trader/var/vision_raw
          key: vision-raw-${{ github.run_id }}
          restore-keys: vision-raw-
      - name: Bagimliliklar
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r trader/requirements.lock
          pip install pytest claude-agent-sdk
          npm install -g @anthropic-ai/claude-code
      - name: Onceki cerceveyi al
        run: |
          git fetch -q origin yeni-kollar-test
          git checkout origin/yeni-kollar-test -- kosu/2026-11-24-45448064810/yeni_kollar
          mkdir -p trader/research && mv kosu/2026-11-24-45448064810/yeni_kollar trader/research/yeni_kollar && rm -rf kosu
          git reset -q
      - name: "1) Setup secimi (Fable)"
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$FABLE" .github/kol-arastirma/1_sec.md setup_secimi.md 5 120 yalniz_oku
      - name: "2) Kodlama (Sonnet)"
        timeout-minutes: 100
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$SONNET" .github/kol-arastirma/2_kodla.md kodla_notu.md 10 250
      - name: "3) Test: gelistirme + kilitli donem"
        timeout-minutes: 170
        working-directory: trader
        env:
          PYTHONPATH: src:paket
        run: |
          python -m pytest -q research/yeni_kollar
          python research/yeni_kollar/calistir.py --setuplar v3 --donem gelistirme --cikti ../sonuc_v3_gelistirme
          python research/yeni_kollar/calistir.py --setuplar v3 --donem kilitli --kilidi-ac --cikti ../sonuc_v3_kilitli
      - name: "4) Rapor ve kol secimi (Fable)"
        if: always()
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$FABLE" .github/kol-arastirma/3_rapor.md rapor.md 4 100 yalniz_oku
      - name: Sonuclari yeni-kollar-test dalina yaz
        if: always()
        run: |
          git config user.name "kol-arastirma"
          git config user.email "kol-arastirma@users.noreply.github.com"
          mkdir -p /tmp/k && cp -r trader/research/yeni_kollar /tmp/k/ 2>/dev/null || true
          for f in setup_secimi.md kodla_notu.md rapor.md maliyet.txt sonuc_v3_gelistirme sonuc_v3_kilitli; do cp -r "$f" /tmp/k/ 2>/dev/null || true; done
          git fetch origin yeni-kollar-test
          git checkout -fB yeni-kollar-test origin/yeni-kollar-test
          d="kosu/$(date -u +%F)-v3-${{ github.run_id }}"; mkdir -p "$d"; cp -r /tmp/k/* "$d/"
          find "$d" -name __pycache__ -prune -exec rm -rf {} +
          git add kosu && git commit -qm "Kitap setuplari: $d" && git push origin yeni-kollar-test
          cat /tmp/k/rapor.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

# Yeni kollar (MF1/GF1/IN1) gecmis veri testi (24.11 kullanici karari). Agent SDK: harcama ANTHROPIC_API_KEY_DENETIM (promosyon kredisi).
# Akis: Sonnet kodlar -> gelistirme donemi testi -> Fable analiz -> Sonnet duzeltir -> tekrar test -> kilitli donem (bir kez) -> Fable rapor.
# Kod ve sonuclar yeni-kollar-test dalina yazilir (gelistirme dali ve sunucu etkilenmez). Elle tetiklenir.
name: yeni-kol-test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeni-kol-test
  cancel-in-progress: false

env:
  DAL: claude/charming-hawking-ab5w5q
  SONNET: claude-sonnet-5-5
  FABLE: claude-fable-5-2

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DAL }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Vision zip onbellegi
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: trader/var/vision_raw
          key: vision-raw-${{ github.run_id }}
          restore-keys: vision-raw-
      - name: Bagimliliklar
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r trader/requirements.lock
          pip install pytest claude-agent-sdk
          npm install -g @anthropic-ai/claude-code
      - name: "1) Kodlama (Sonnet)"
        timeout-minutes: 90
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$SONNET" .github/kol-test/1_kodla.md kodla_notu.md 10 250
      - name: "2) Gelistirme donemi testi, tur 1"
        timeout-minutes: 160
        working-directory: trader
        env:
          PYTHONPATH: src:paket
        run: |
          python -m pytest -q research/yeni_kollar
          python research/yeni_kollar/calistir.py --donem gelistirme --cikti ../sonuc_tur1
      - name: "3) Analiz (Fable)"
        timeout-minutes: 40
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$FABLE" .github/kol-test/2_analiz.md analiz_tur1.md 5 120 yalniz_oku
      - name: "4) Duzeltme (Sonnet)"
        timeout-minutes: 60
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$SONNET" .github/kol-test/3_duzelt.md duzelt_notu.md 6 200
      - name: "5) Gelistirme donemi testi, tur 2 + kilitli donem (bir kez)"
        timeout-minutes: 150
        working-directory: trader
        env:
          PYTHONPATH: src:paket
        run: |
          python -m pytest -q research/yeni_kollar
          python research/yeni_kollar/calistir.py --donem gelistirme --cikti ../sonuc_tur2
          python research/yeni_kollar/calistir.py --donem kilitli --kilidi-ac --cikti ../sonuc_kilitli
      - name: "6) Rapor (Fable)"
        if: always()
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "$FABLE" .github/kol-test/4_rapor.md rapor.md 4 80 yalniz_oku
      - name: Sonuclari yeni-kollar-test dalina yaz
        if: always()
        run: |
          git config user.name "yeni-kol-test"
          git config user.email "yeni-kol-test@users.noreply.github.com"
          mkdir -p /tmp/k && cp -r trader/research/yeni_kollar fikirler/yeni-kollar/tasarim_v2.md /tmp/k/ 2>/dev/null || true
          for f in kodla_notu.md analiz_tur1.md duzelt_notu.md rapor.md maliyet.txt sonuc_tur1 sonuc_tur2 sonuc_kilitli; do cp -r "$f" /tmp/k/ 2>/dev/null || true; done
          git fetch origin yeni-kollar-test || true
          if git rev-parse --verify -q origin/yeni-kollar-test >/dev/null; then git checkout -fB yeni-kollar-test origin/yeni-kollar-test; else git checkout -f --orphan yeni-kollar-test; git rm -rfq . ; fi
          d="kosu/$(date -u +%F)-${{ github.run_id }}"; mkdir -p "$d"; cp -r /tmp/k/* "$d/"
          find "$d" -name __pycache__ -prune -exec rm -rf {} +
          git add kosu && git commit -qm "Yeni kol testi: $d" && git push origin yeni-kollar-test
          cat /tmp/k/rapor.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

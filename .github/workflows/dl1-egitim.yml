# DL1@1h gunluk egitim (ust lig derin ogrenme kolu; tasarim fikirler/pazartesi-23-11/ust-lig-tasarim.md bolum 2/6; kullanici karari 23.11:
# her gun egitim, yeni paket yalniz kapiyi gecer VE mevcuttan belirgin iyiyse yayinlanir).
# Yalniz cron + elle (workflow_dispatch) tetiklenir; push/pull_request ile TETIKLENMEZ (sonsuz dongu yok: paketi bu is dala yazar, tests.yml
# trader/models/** degisince kosar, tests.yml bu isi tetiklemez). PyTorch YALNIZ burada pip ile kurulur (trader requirements kilidine eklenmez).
# NOT: cron yalniz varsayilan dalda (main) calisir; bu dosya main'de de bulunmali. Is, kodu ve paketi claude/charming-hawking-ab5w5q dalindan alir.
# GITHUB_TOKEN itmesi baska is akislarini tetiklemez; bu yuzden itmeden sonra tests.yml elle (workflow_dispatch) calistirilir
# (oto_guncelle yalniz tests.yml'in o dalda basarili kosusunu bekler).
name: dl1-egitim

on:
  schedule:
    - cron: "20 6 * * *"      # her gun 06:20 UTC (borsa sakin saat)
  workflow_dispatch:

permissions:
  contents: write            # paketi dala itmek
  actions: write             # itmeden sonra tests.yml'i workflow_dispatch ile calistirmak

concurrency:
  group: dl1-egitim
  cancel-in-progress: false

env:
  DAL: claude/charming-hawking-ab5w5q

jobs:
  egit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DAL }}
          persist-credentials: true     # git push icin (yalniz bu is; contents: write)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Vision zip onbellegi (aylik/gunluk zip'ler degismez; checksum yine dogrulanir)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: trader/var/vision_raw
          key: vision-raw-${{ github.run_id }}
          restore-keys: vision-raw-

      - name: Bagimliliklar (sunucu kilidi + PyTorch CPU; torch kilide GIRMEZ)
        working-directory: trader
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Duman (sentetik: egitim + numpy-PyTorch parite + paket turu)
        working-directory: trader
        run: python research/dl1/duman.py

      - name: Egitim (Vision indir, walk-forward, kapi, yayin karari)
        id: egit
        working-directory: trader
        run: python research/dl1/egit.py --kesim "$(date -u +%F)" --cikti models/dl1 --rapor var/dl1_rapor

      - name: Ozet (karar ve iki modelin metrikleri)
        if: always()
        run: |
          if [ -f trader/var/dl1_rapor/dl1_rapor.md ]; then cat trader/var/dl1_rapor/dl1_rapor.md >> "$GITHUB_STEP_SUMMARY"; else echo "DL1 raporu uretilmedi (egitim hatasi)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Paketi dala it (yalniz kapi + iyilesme kosulu saglandiysa)
        id: it
        if: steps.egit.outputs.paket_yazildi == '1'
        run: |
          git config user.name "dl1-egitim"
          git config user.email "dl1-egitim@users.noreply.github.com"
          git add trader/models/dl1/DL1@1h.json
          git commit -m "DL1 paket: $(date -u +%F)"
          git pull --rebase origin "$DAL"
          git push origin "HEAD:$DAL"

      - name: tests.yml'i calistir (paket motoru etkiler; token itmesi tetiklemez)
        if: steps.it.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --ref "$DAL" --repo "$GITHUB_REPOSITORY"

# DD-4 (O13): koda dokunan her gonderimde testler + statik kontroller. Gizli anahtar kullanmaz; yalniz okuma izni.
# Eylemler tam commit SHA ile sabit (git ls-remote ile dogrulandi): checkout v4.2.2, setup-python v5.6.0.
# Python 3.12 = Ubuntu 24.04 sunucusunun sistem python3'u (deploy/install.sh en az 3.11 ister).
name: tests

# Tetik: koda/kuruluma dokunan gonderimler + elle. (schedule yalniz varsayilan dalda (main) calisir, bu dalda calismaz.)
# Belge-only gonderimler kosmaz; ard arda gonderimde eski kosu iptal edilir (dakika tasarrufu).
on:
  push:
    branches: [claude/charming-hawking-ab5w5q]
    paths: ["trader/src/**", "trader/scripts/**", "trader/deploy/**", "trader/tests/**", "trader/research/**", "trader/requirements*", "trader/config/**", "trader/models/**", ".github/workflows/**"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hizli duman testi (kurulum sonrasi kararlilik plani, madde 5): motoru iceri aktarir ve 1 gunluk kagit kosusu yapar
  # (sentetik veri, ag/anahtar yok). Tam takimdan ayri/paralel kosar; oto_guncelle.sh yalniz tests.yml'in TUM islerinin
  # yesil oldugu commit'i kurar (workflow kosusu basarili sayilmasi icin her is gecmeli).
  duman:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bagimliliklar (sunucu kilidi)
        working-directory: trader
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest==9.2.0"   # duman, sentetik zinciri tests/e2e yardimcilarindan alir (pytest'i ice aktarir)

      - name: Motor duman testi (import + kisa kagit kosusu)
        working-directory: trader
        run: python scripts/ci_duman.py

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # testler 0fc8b5c tam gecmisini git archive ile okur (sig klon yetmez)
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bagimliliklar (sunucu kilidi + test paketleri)
        working-directory: trader
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest==9.2.0" "pytest-xdist==3.8.0" "PyYAML==6.0.3"

      - name: compileall
        run: python -m compileall -q trader/src trader/scripts

      - name: shellcheck (warning)
        run: shellcheck -S warning trader/deploy/*.sh trader/scripts/*.sh

      - name: systemd-analyze verify
        working-directory: trader/deploy
        run: |
          # Sablon birimlere ornek ad verilir (x@learner.*). Kosucuda /opt/trader, "trader" kullanicisi ve
          # env dosyalari yok: yalniz bu ortama ozgu iletiler (yok/calistirilamaz/kullanici) tolere edilir;
          # soz dizimi, bilinmeyen anahtar ve baglanti hatalari yine basarisiz sayilir.
          D="$(mktemp -d)"
          for f in *.service *.timer *.slice; do
            cp "$f" "$D/$f"
            case "$f" in *@.*) cp "$f" "$D/${f/@./@learner.}";; esac
          done
          cd "$D"
          rc=0
          systemd-analyze verify --man=no ./*.service ./*.timer ./*.slice >out.txt 2>&1 || rc=$?
          cat out.txt
          if [ "$rc" -ne 0 ]; then
            bad="$(grep -v -i -E 'is not executable|No such file or directory|Failed to (look up|resolve) user|Failed to (look up|resolve) group|EnvironmentFile|not found' out.txt || true)"
            if [ -n "$bad" ]; then echo "Beklenmeyen hata:"; echo "$bad"; exit 1; fi
            echo "Yalniz kosucuya ozgu eksik yol/kullanici iletileri; tolere edildi."
          fi

      - name: pytest (tam; var/history yoksa gercek-veri testleri atlanir)
        working-directory: trader
        run: python -m pytest -q -n auto   # paralel (xdist; kosucu 4 cekirdek). python -m: trader/ sys.path basinda (tests.engine iceaktarimlari)

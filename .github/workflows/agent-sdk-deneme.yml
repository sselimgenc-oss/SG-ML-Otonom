# Agent SDK deneme isi (24.11 kullanici karari): Max planinin aylik API promosyon kredisi Agent SDK kullanimini karsiliyor mu?
# Elle tetiklenir (workflow_dispatch). Haiku ile kucuk bir salt okuma gorevi yapar (birkac sent). Sonra Claude Console > Maliyet'te
# harcamanin promosyon kredisinden mi yoksa satin alinan bakiyeden mi dustugu kontrol edilir.
# Anahtar: repo gizli anahtari ANTHROPIC_API_KEY_DENETIM (degeri hicbir yere yazdirilmaz).
name: agent-sdk-deneme

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deneme:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/charming-hawking-ab5w5q
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Agent SDK kurulumu
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install claude-agent-sdk

      - name: Kucuk salt okuma gorevi (Haiku)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: |
          cat > /tmp/deneme.py <<'PY'
          import asyncio
          from claude_agent_sdk import query, ClaudeAgentOptions

          async def main():
              opts = ClaudeAgentOptions(
                  model="claude-haiku-5-5",
                  allowed_tools=["Read", "Grep", "Glob"],
                  max_turns=4,
                  cwd=".",
              )
              async for m in query(prompt="trader/config/lesson.json dosyasini oku ve icindeki anahtar sayisini tek satirla yaz.", options=opts):
                  print(type(m).__name__, getattr(m, "result", "") or "")
                  cost = getattr(m, "total_cost_usd", None)
                  if cost is not None:
                      print("maliyet_usd:", cost)

          asyncio.run(main())
          PY
          python /tmp/deneme.py

# Denetim duzeltmeleri (24.11 kullanici karari). Agent SDK: harcama ANTHROPIC_API_KEY_DENETIM (promosyon kredisi).
# Akis: Fable risk kademesi karari -> Sonnet duzeltir + testler -> tam test takimi -> Fable inceleme.
# Sonuc duzeltme-denetim dalina yazilir; gelistirme dalina birlestirme ELLE (oturumda) yapilir. Sunucu etkilenmez.
name: denetim-duzeltme

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denetim-duzeltme
  cancel-in-progress: false

env:
  DAL: claude/charming-hawking-ab5w5q

jobs:
  duzelt:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DAL }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Bagimliliklar
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r trader/requirements.lock
          pip install "pytest==9.2.0" "PyYAML==6.0.3" claude-agent-sdk
          npm install -g @anthropic-ai/claude-code
      - name: "1) Risk kademesi karari (Fable)"
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py claude-fable-5-2 .github/duzeltme/1_kademe.md kademe_karar.md 3 80 yalniz_oku
      - name: "2) Duzeltmeler (Sonnet)"
        timeout-minutes: 150
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py claude-sonnet-5-5 .github/duzeltme/2_duzelt.md duzelt_notu.md 15 350
      - name: "3) Tam test takimi"
        if: always()
        timeout-minutes: 90
        working-directory: trader
        run: |
          set -o pipefail
          python -m compileall -q src scripts
          python -m pytest -q -p no:cacheprovider 2>&1 | tail -40 | tee ../test_sonucu.txt
      - name: "4) Inceleme (Fable)"
        if: always()
        timeout-minutes: 30
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: |
          git diff -- . ':!kademe_karar.md' ':!duzelt_notu.md' ':!test_sonucu.txt' ':!maliyet*' > degisiklik.diff
          python .github/kol-test/ajan.py claude-fable-5-2 .github/duzeltme/3_incele.md inceleme.md 4 100 yalniz_oku
      - name: Sonucu duzeltme-denetim dalina yaz
        if: always()
        run: |
          git config user.name "denetim-duzeltme"
          git config user.email "denetim-duzeltme@users.noreply.github.com"
          d="fikirler/duzeltme/$(date -u +%F)-${{ github.run_id }}"; mkdir -p "$d"
          for f in kademe_karar.md duzelt_notu.md test_sonucu.txt inceleme.md maliyet.txt degisiklik.diff; do mv "$f" "$d/" 2>/dev/null || true; done
          find . -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          git checkout -B duzeltme-denetim
          git add -A
          git commit -qm "Denetim duzeltmeleri (Agent SDK kosusu ${{ github.run_id }})" || true
          git push -f origin duzeltme-denetim
          cat "$d/inceleme.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

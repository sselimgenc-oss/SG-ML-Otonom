# Genel ajan gorevi (24.11 kullanici karari: isler API kredisiyle, oturum tokeni harcanmaz). Agent SDK, ANTHROPIC_API_KEY_DENETIM (promosyon kredisi).
# Girdi: istem dosyasi (.github/gorev/...), model, butce. Sonuc ve ajanin yaptigi degisiklikler gorev-<run_id> dalina yazilir; birlestirme oturumda yapilir.
name: ajan-gorev

on:
  workflow_dispatch:
    inputs:
      istem:
        description: "Istem dosyasi (depo kokune gore)"
        required: true
      model:
        description: "Model"
        required: false
        default: claude-fable-5-2
      butce:
        description: "Azami harcama ($)"
        required: false
        default: "5"
      yalniz_oku:
        description: "yalniz_oku ya da yaz"
        required: false
        default: yalniz_oku

permissions:
  contents: read

env:
  DAL: claude/charming-hawking-ab5w5q

jobs:
  gorev:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.DAL }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Bagimliliklar
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          pip install --require-hashes -r trader/requirements.lock
          pip install "pytest==9.2.0" "PyYAML==6.0.3" claude-agent-sdk
          npm install -g @anthropic-ai/claude-code
          git fetch -q origin yeni-kollar-test duzeltme-denetim denetim-raporlari || true
          mkdir -p onceki && (git archive origin/yeni-kollar-test kosu | tar -x -C onceki) || true   # gecmis kol testleri, salt okuma icin
      - name: Ajan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_DENETIM }}
        run: python .github/kol-test/ajan.py "${{ inputs.model }}" "${{ inputs.istem }}" gorev_sonuc.md "${{ inputs.butce }}" 300 "${{ inputs.yalniz_oku }}"
      - name: Sonucu gorev dalina yaz
        if: always()
        run: |
          git config user.name "ajan-gorev"
          git config user.email "ajan-gorev@users.noreply.github.com"
          d="fikirler/gorev/$(date -u +%F)-${{ github.run_id }}"; mkdir -p "$d"
          mv gorev_sonuc.md maliyet.txt "$d/" 2>/dev/null || true
          rm -rf onceki
          find . -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          git checkout -B "gorev-${{ github.run_id }}"
          git add -A && git commit -qm "Ajan gorevi ${{ github.run_id }}: ${{ inputs.istem }}" || true
          git push -f origin "gorev-${{ github.run_id }}"
          cat "$d/gorev_sonuc.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
